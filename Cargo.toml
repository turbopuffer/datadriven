[package]
name = "datadriven"
version = "0.9.0"
authors = ["Justin Jaffray <justin.jaffray@gmail.com>"]
edition = "2018"
license = "Apache-2.0"
description = "Rewritable table-driven testing"
repository = "https://github.com/justinj/datadriven"
homepage = "https://github.com/justinj/datadriven"
readme = "README.md"

[features]
default = ["async"]
async = ["futures"]

[dependencies]
console = "0.16"
futures = { version = "0.3", optional = true }
thiserror = "1.0.40"
similar = { version = "3.1", features = ["std", "text", "inline"] }

[dev-dependencies]
anyhow = "1.0"
tokio = { version = "1.7", features = ["macros", "rt"] }
